/* Shopify one-page checkout layout, coloured with the theme's tokens (assets/theme/cmm-inline.css). */
#cm-adjust body.tpl-checkout { display: block; background: #fff; color: rgb(41, 41, 41); }
/* Shopify checkout: white form column, grey summary column running to the window edge. */
@media screen and (min-width: 1000px) { #cm-adjust body.tpl-checkout main { background: linear-gradient(to right, #fff 50%, #f5f5f5 50%); } }
.cmm-co-header { border-bottom: 1px solid #e6e6e6; background: #fff; }
.cmm-co-header__inner { max-width: 112rem; margin: 0 auto; padding: 1.6rem 2rem; display: flex; align-items: center; justify-content: space-between; }
.cmm-co-header__logo img { width: 18rem; height: auto; display: block; }
.cmm-co-header__cart img { width: 4rem; height: 4rem; }
.cmm-co { max-width: 112rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); }
@media screen and (min-width: 1000px) { .cmm-co { grid-template-columns: minmax(0, 58%) minmax(0, 42%); min-height: calc(100vh - 8rem); } }
.cmm-co__main { padding: 3.2rem 2rem 4.8rem; background: #fff; }
@media screen and (min-width: 1000px) { .cmm-co__main { padding: 3.8rem 3.8rem 6rem 2rem; } }
.cmm-co__aside { background: #f5f5f5; border-left: 1px solid #e6e6e6; padding: 3.2rem 2rem; }
@media screen and (min-width: 1000px) { .cmm-co__aside { padding: 3.8rem 2rem 3.8rem 3.8rem; } .cmm-co__aside-inner { position: sticky; top: 3.8rem; } }
@media screen and (max-width: 999px) { .cmm-co__aside { order: -1; border-left: 0; border-bottom: 1px solid #e6e6e6; } }
.cmm-co h2 { font-size: 2.1rem; font-weight: 700; margin: 3.2rem 0 1.4rem; letter-spacing: 0.04rem; color: rgb(41, 41, 41); }
.cmm-co section:first-child h2 { margin-top: 0; }
.cmm-co-note { font-size: 1.3rem; color: rgba(41, 41, 41, 0.7); margin: -0.6rem 0 1.2rem; }
.cmm-co-grid { display: flex; flex-wrap: wrap; gap: 1.2rem; }
.cmm-co-field { flex: 1 1 100%; min-width: 0; }
.cmm-co-field--half { flex: 1 1 calc(50% - 0.6rem); }
.cmm-co-field label { display: block; font-size: 1.2rem; margin: 0 0 0.4rem; color: rgba(41, 41, 41, 0.75); }
.cmm-co-field input, .cmm-co-field select { width: 100%; height: 4.8rem; padding: 0 1.2rem; border: 1px solid #d9d9d9; border-radius: 0.6rem; background: #fff; font: inherit; font-size: 1.5rem; color: rgb(41, 41, 41); }
.cmm-co-field input:focus, .cmm-co-field select:focus { outline: none; border-color: rgb(47, 154, 224); box-shadow: 0 0 0 1px rgb(47, 154, 224); }
.cmm-co-field input:disabled, .cmm-co-field select:disabled { background: #f0f0f0; color: #767676; -webkit-text-fill-color: #767676; opacity: 1; cursor: not-allowed; }
.cmm-co-check:has(input:disabled) { color: #767676; cursor: not-allowed; }
.cmm-co-check { display: flex; align-items: center; gap: 0.8rem; margin-top: 1.2rem; font-size: 1.4rem; }
.cmm-co-box { border: 1px solid #d9d9d9; border-radius: 0.6rem; overflow: hidden; background: #fff; }
.cmm-co-option { display: flex; align-items: center; gap: 1.2rem; padding: 1.6rem; border-top: 1px solid #d9d9d9; font-size: 1.5rem; cursor: pointer; }
.cmm-co-option:first-child { border-top: 0; }
.cmm-co-option input { width: 1.8rem; height: 1.8rem; accent-color: rgb(47, 154, 224); margin: 0; }
.cmm-co-option__label { flex: 1; }
.cmm-co-option__price { font-weight: 700; }
.cmm-co-option.is-selected { background: #f0f8fe; box-shadow: inset 0 0 0 1px rgb(47, 154, 224); }
.cmm-co-pay { width: 100%; margin-top: 2.8rem; min-height: 5.6rem; font-size: 1.8rem; font-weight: 700; border-radius: 0.6rem; }
.cmm-co-errors { margin-top: 1.6rem; color: rgb(221, 29, 29); font-size: 1.4rem; }
.cmm-co-footer { border-top: 1px solid #e6e6e6; margin-top: 4.8rem; padding-top: 1.6rem; display: flex; flex-wrap: wrap; gap: 1.6rem; font-size: 1.2rem; }
.cmm-co-footer a { color: rgb(47, 154, 224); }
.cmm-co-lines { list-style: none; margin: 0 0 2rem; padding: 0; }
.cmm-co-line { display: flex; align-items: center; gap: 1.4rem; margin-bottom: 1.4rem; font-size: 1.4rem; }
.cmm-co-line__img { position: relative; flex: 0 0 6.4rem; height: 6.4rem; border: 1px solid #ddd; border-radius: 0.8rem; background: #fff; }
.cmm-co-line__img img { width: 100%; height: 100%; object-fit: contain; border-radius: 0.8rem; }
.cmm-co-line__qty { position: absolute; top: -0.8rem; right: -0.8rem; min-width: 2.2rem; height: 2.2rem; padding: 0 0.6rem; border-radius: 1.1rem; background: rgba(41, 41, 41, 0.85); color: #fff; font-size: 1.2rem; line-height: 2.2rem; text-align: center; }
.cmm-co-line__title { flex: 1; min-width: 0; }
.cmm-co-line__variant { display: block; font-size: 1.2rem; color: rgba(41, 41, 41, 0.6); }
.cmm-co-line__price { white-space: nowrap; }
.cmm-co-totals { margin: 0; font-size: 1.4rem; }
.cmm-co-totals div { display: flex; justify-content: space-between; padding: 0.4rem 0; }
.cmm-co-totals dt, .cmm-co-totals dd { margin: 0; }
.cmm-co-totals .cmm-co-total { font-size: 1.9rem; font-weight: 700; padding-top: 1.2rem; }
.cmm-co-total small { font-size: 1.2rem; font-weight: 400; color: rgba(41, 41, 41, 0.6); margin-right: 0.6rem; }
</style>

<main id="MainContent" class="content-for-layout focus-none" role="main" tabindex="-1">

<form class="cmm-co" data-cmm-checkout="" novalidate="">
<div class="cmm-co__main">
<section><h2>連絡先</h2><div class="cmm-co-grid"><div class="cmm-co-field"><label for="co-email">メールアドレス</label>
<input id="co-email" type="email" name="email" value="demo@example.com" disabled=""></div></div>
<label class="cmm-co-check"><input type="checkbox" name="newsletter" value="1" disabled="">メールでニュースやオファーを受け取る</label></section>
<section><h2>配送</h2><div class="cmm-co-grid">
<div class="cmm-co-field"><label for="co-country">国/地域</label><select id="co-country" name="country" disabled=""><option value="JP" selected="">日本</option></select></div>
<div class="cmm-co-field cmm-co-field--half"><label for="co-lastName">姓</label>
<input id="co-lastName" type="text" name="lastName" value="山田" disabled=""></div><div class="cmm-co-field cmm-co-field--half"><label for="co-firstName">名</label>
<input id="co-firstName" type="text" name="firstName" value="太郎" disabled=""></div>
<div class="cmm-co-field cmm-co-field--half"><label for="co-postal">郵便番号</label>
<input id="co-postal" type="text" name="postal" value="100-0001" disabled=""></div>
<div class="cmm-co-field cmm-co-field--half"><label for="co-prefecture">都道府県</label>
<input id="co-prefecture" type="text" name="prefecture" value="東京都" disabled=""></div>
<div class="cmm-co-field"><label for="co-city">市区町村</label>
<input id="co-city" type="text" name="city" value="千代田区" disabled=""></div>
<div class="cmm-co-field"><label for="co-address1">住所</label>
<input id="co-address1" type="text" name="address1" value="千代田1-1" disabled=""></div>
<div class="cmm-co-field"><label for="co-address2">建物名、部屋番号など（任意）</label>
<input id="co-address2" type="text" name="address2" value="" disabled=""></div>
<div class="cmm-co-field"><label for="co-phone">電話</label>
<input id="co-phone" type="tel" name="phone" value="000-0000-0000" disabled=""></div>
</div></section>
<section><h2>配送方法</h2><div data-cmm-shipping-method="">
<div class="cmm-co-box"><label class="cmm-co-option is-selected"><input type="radio" name="shippingMethod" value="standard" checked=""><span class="cmm-co-option__label">通常配送</span><span class="cmm-co-option__price" data-cmm-shipping-fee=""></span></label></div></div></section>
<section><h2>支払い</h2><p class="cmm-co-note">すべての取引は安全で暗号化されています。</p>
<div class="cmm-co-box" data-cmm-payment="">
<label class="cmm-co-option is-selected"><input type="radio" name="paymentMethod" value="クレジットカード" checked=""><span class="cmm-co-option__label">クレジットカード</span></label>
<label class="cmm-co-option"><input type="radio" name="paymentMethod" value="Apple Pay"><span class="cmm-co-option__label">Apple Pay</span></label>
<label class="cmm-co-option"><input type="radio" name="paymentMethod" value="楽天ペイ"><span class="cmm-co-option__label">楽天ペイ</span></label>
<label class="cmm-co-option"><input type="radio" name="paymentMethod" value="d払い"><span class="cmm-co-option__label">d払い</span></label>
<label class="cmm-co-option"><input type="radio" name="paymentMethod" value="PayPay"><span class="cmm-co-option__label">PayPay</span></label>
<label class="cmm-co-option"><input type="radio" name="paymentMethod" value="au PAY"><span class="cmm-co-option__label">au PAY</span></label>
<label class="cmm-co-option"><input type="radio" name="paymentMethod" value="あと払いPaidy"><span class="cmm-co-option__label">あと払いPaidy</span></label>
</div></section>
<button type="submit" class="button button--primary cmm-co-pay" data-cmm-pay="">支払う（シミュレーション）</button>

</div>

<dl class="cmm-co-totals"><div><dt>小計</dt><dd data-cmm-checkout-subtotal="">¥0</dd></div><div><dt>配送料</dt><dd data-cmm-checkout-shipping=""></dd></div><div class="cmm-co-total"><dt>合計</dt><dd><small>JPY</small><span data-cmm-checkout-total="">¥0</span></dd></div></dl>
</div></aside>
